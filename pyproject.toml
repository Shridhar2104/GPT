[project]
name = "gpt"
version = "0.1.0"
description = "Building an LLM from scratch"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch",
    "numpy",
    "tiktoken",
    "datasets",
    "tqdm",
    "matplotlib",
]

[dependency-groups]
dev = [
    "ipykernel",
    "ruff",
    "pytest",
]

[tool.ruff]
line-length = 100
